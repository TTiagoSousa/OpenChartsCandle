name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security problems are reported privately: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag you installed (for example v1.0.0) or a commit.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: Chart family
      options:
        - candlestick (terminal)
        - candlestick (createChart)
        - pie
        - line
        - bar
        - gauge
        - treemap
        - scatter
        - calendar
        - radar
        - boxplot
        - heatmap
        - graph
        - tree
        - parallel
        - sankey
        - funnel
        - matrix
        - custom
        - demo site / docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code or steps that show the problem. A link to a CodePen / StackBlitz helps a lot.
      render: ts
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 142 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
